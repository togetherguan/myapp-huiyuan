<!doctype html>
<html>
<head>
  <style>
    html,body { margin:0; padding:16px; background:#6b6b6b; }
    .row { display:flex; gap:16px; align-items:flex-end; }
    .tile { background:transparent; }
    svg.s16 { width:16px; height:16px; display:block; }
    svg.s32 { width:32px; height:32px; display:block; }
    svg.s64 { width:64px; height:64px; display:block; }
  </style>
</head>
<body>
  <div class="row">
    <svg class="s16" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
      <rect width="32" height="32" rx="8" fill="#0c0d0b"/>
      <circle cx="16" cy="16" r="11" fill="#c4d4b8"/>
      <circle cx="16" cy="16" r="8" fill="#0c0d0b"/>
      <circle cx="16" cy="16" r="5" fill="#f3f1ea"/>
      <circle cx="16" cy="16" r="2" fill="#0c0d0b"/>
    </svg>
    <svg class="s32" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
      <rect width="32" height="32" rx="8" fill="#0c0d0b"/>
      <circle cx="16" cy="16" r="11" fill="#c4d4b8"/>
      <circle cx="16" cy="16" r="8" fill="#0c0d0b"/>
      <circle cx="16" cy="16" r="5" fill="#f3f1ea"/>
      <circle cx="16" cy="16" r="2" fill="#0c0d0b"/>
    </svg>
    <svg class="s64" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
      <rect width="32" height="32" rx="8" fill="#0c0d0b"/>
      <circle cx="16" cy="16" r="11" fill="#c4d4b8"/>
      <circle cx="16" cy="16" r="8" fill="#0c0d0b"/>
      <circle cx="16" cy="16" r="5" fill="#f3f1ea"/>
      <circle cx="16" cy="16" r="2" fill="#0c0d0b"/>
    </svg>
  </div>
</body>
</html>
