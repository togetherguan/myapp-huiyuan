<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MyApp 会员</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #12110e;
        --card: #1c1a16;
        --ink: #f6f1e7;
        --muted: #b7ae9f;
        --gold: #e4b15a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 28px 20px;
        background:
          radial-gradient(900px 420px at 50% -10%, rgba(228, 177, 90, 0.18), transparent 60%),
          var(--bg);
        color: var(--ink);
        font: 16px/1.5 "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      }
      main {
        width: min(420px, 100%);
        background: var(--card);
        border: 1px solid rgba(228, 177, 90, 0.28);
        border-radius: 20px;
        padding: 28px 22px 24px;
      }
      .mark {
        width: 52px;
        height: 52px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        background: linear-gradient(160deg, #f0cc86, #b8862f);
        color: #1a1408;
        font-weight: 800;
        letter-spacing: -0.04em;
      }
      h1 { margin: 16px 0 6px; font-size: 26px; }
      p { margin: 0; color: var(--muted); }
      ol { margin: 16px 0 0; padding-left: 1.2em; color: var(--ink); }
      li { margin: 8px 0; }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.86em;
        color: var(--gold);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">MY</div>
      <h1>MyApp 会员</h1>
      <p>这个安装包是会员 App 的外壳。店家、产品和 TNG 付款都在已发布的网站上，打包前要写上网站地址。</p>
      <ol>
        <li>发布网页版之后，在项目目录执行<br /><code>CAP_SERVER_URL=https://你的网址 npm run android:sync</code></li>
        <li>再用 Android Studio 或 <code>cd android && ./gradlew assembleDebug</code> 打出 APK。</li>
      </ol>
    </main>
  </body>
</html>
